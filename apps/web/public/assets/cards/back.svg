      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="lattice" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
