services:
  postgres:
    image: postgres:17-alpine
    container_name: agentholdem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentholdem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentholdem}
      POSTGRES_DB: agentholdem
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentholdem -d agentholdem']
      interval: 5s
      timeout: 3s
      retries: 10
